name: Update player values

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC = 7:00 AM ET, daily
  workflow_dispatch:         # manual "Run workflow" button

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build values
        run: python scripts/build_values.py
      - name: Commit if changed
        run: |
          git config user.name "value-bot"
          git config user.email "actions@github.com"
          git add data/values.json
          git diff --cached --quiet || git commit -m "Daily values $(date -u +%F)"
          git push

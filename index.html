<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect } = React;

let VALUES = null;


const FONTS = `@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');`;

const C = { bg:"#F5F6F8", surface:"#FFFFFF", line:"#E5E8EE", ink:"#12161C", muted:"#67707E",
  accent:"#2B50F5", green:"#0E9F6E", warn:"#E0521F", soft:"#EEF1F6" };
const POS_COLOR = { QB:"#8B5CF6", RB:"#0E9488", WR:"#0284C7", TE:"#D97706" };
const POS_LIST = ["QB","RB","WR","TE"];
const font = { disp:"'Space Grotesk', sans-serif", body:"'Inter', sans-serif" };
const card = { background:C.surface, border:`1px solid ${C.line}`, borderRadius:14, boxShadow:"0 1px 2px rgba(16,22,28,0.04)" };

// ---------------- value lookups ----------------
const BY_SID = {}, BY_NAME = {}, BY_MID = {};
const normName = (n) => n.toLowerCase().replace(/[.'’,]/g,"").replace(/-/g," ").replace(/ (jr|sr|ii|iii|iv|v)$/,"").trim();
function initValues(d){
  VALUES = d;
  for (const p of VALUES.players){ if(p.sid) BY_SID[p.sid]=p; if(p.mid) BY_MID[p.mid]=p; BY_NAME[normName(p.n)]=p; }
}
const fmtKey = (sf) => sf ? "v2" : "v1";

// Set this to your deployed Cloudflare Worker URL to enable MFL/Fleaflicker imports
// in the browser, e.g. "https://tradedesk-proxy.yourname.workers.dev"
const PROXY = "";
const pfetch = (url) => PROXY ? fetch(`${PROXY}?url=${encodeURIComponent(url)}`) : fetch(url);

// ---------------- league math (team-count agnostic) ----------------
const weight = (i) => Math.max(0.55, 1 - 0.12 * Math.pow(i, 0.9));
const sideMath = (a) => { const s=[...a].sort((x,y)=>y.v-x.v);
  return { raw:s.reduce((t,x)=>t+x.v,0), adj:Math.round(s.reduce((t,x,i)=>t+x.v*weight(i),0)) }; };
const POS_W = { QB:[1,.4], RB:[1,1,.6,.3], WR:[1,1,.6,.3], TE:[1,.4] };
const posStrength = (t) => { const o={};
  for(const pos of POS_LIST){ const ps=t.players.filter(p=>p.p===pos).sort((a,b)=>b.v-a.v);
    o[pos]=Math.round(POS_W[pos].reduce((s,w,i)=>s+(ps[i]?.v||0)*w,0)); } return o; };
const coreAge = (t) => { const top=t.players.slice(0,10).filter(p=>p.a);
  return top.length? (top.reduce((s,p)=>s+p.a,0)/top.length).toFixed(1) : "—"; };
const totalStrength = (t) => { const v=t.players.map(p=>p.v);
  return Math.round(v.slice(0,10).reduce((a,b)=>a+b,0)+v.slice(10).reduce((a,b)=>a+b,0)*0.3); };

function tierProbs(rank, n){
  const frac = rank / n;
  if (frac > 2/3) return [0.6,0.3,0.1];
  if (frac > 1/3) return [0.2,0.6,0.2];
  return [0.1,0.3,0.6];
}
function pickValue(year, round, origRank, nTeams, sf){
  const tiers = VALUES.tiers[sf?"2":"1"];
  const years = Object.keys(tiers).sort();
  const yr = tiers[year] ? year : years[years.length-1];
  const disc = Math.pow(0.85, Math.max(0, parseInt(year) - parseInt(years[years.length-1])));
  if (round > 3) return Math.round(120*disc/(round-2));
  const [pe,pm,pl] = tierProbs(origRank, nTeams);
  const t = tiers[yr];
  return Math.round((pe*t["E"+round] + pm*t["M"+round] + pl*t["L"+round]) * disc);
}

// Build a full analyzed league from raw teams: [{id,name,players:[{n,p,v,a,hot?}],rawPicks:[{year,round,origId}]}]
function analyzeLeague(name, rawTeams, sf, updated){
  const teams = rawTeams.map(t => ({...t, strength: totalStrength(t)}));
  teams.sort((a,b)=>b.strength-a.strength);
  teams.forEach((t,i)=>t.rank=i+1);
  const byId = Object.fromEntries(teams.map(t=>[t.id,t]));
  const n = teams.length;
  for (const t of teams){
    t.picks = (t.rawPicks||[]).map(pk => {
      const orig = byId[pk.origId] || t;
      return { n:`${pk.year} R${pk.round} (${pk.origId===t.id?"own":orig.name.split(" ")[0]})`,
        yr:pk.year, rd:pk.round, origRank:orig.rank, v:pickValue(pk.year, pk.round, orig.rank, n, sf) };
    }).sort((a,b)=>b.v-a.v);
    delete t.rawPicks;
    t.pos = posStrength(t); t.age = coreAge(t);
    t.picksVal = t.picks.reduce((s,p)=>s+p.v,0);
    t.phase = t.rank <= n/3 ? "CONTEND" : (t.rank <= 2*n/3 ? "MIDDLE" : "REBUILD");
  }
  const medians = {};
  for (const pos of POS_LIST){
    const vals = teams.map(t=>t.pos[pos]).sort((a,b)=>a-b);
    const mid = Math.floor(vals.length/2);
    medians[pos] = vals.length%2 ? vals[mid] : (vals[mid-1]+vals[mid])/2;
  }
  return { name, sf, updated, teams, medians };
}

// ---------------- Sleeper import ----------------
async function importSleeper(username, season){
  const j = async (u)=>{ const r=await fetch(u); if(!r.ok) throw new Error("Sleeper: "+r.status); return r.json(); };
  const user = await j(`https://api.sleeper.app/v1/user/${encodeURIComponent(username)}`);
  if(!user) throw new Error("Username not found");
  const leagues = await j(`https://api.sleeper.app/v1/user/${user.user_id}/leagues/nfl/${season}`);
  if(!leagues?.length) throw new Error("No leagues found for "+season);
  return { user, leagues };
}
async function loadSleeperLeague(lg){
  const j = async (u)=>{ const r=await fetch(u); if(!r.ok) throw new Error("Sleeper: "+r.status); return r.json(); };
  const [rosters, users, traded] = await Promise.all([
    j(`https://api.sleeper.app/v1/league/${lg.league_id}/rosters`),
    j(`https://api.sleeper.app/v1/league/${lg.league_id}/users`),
    j(`https://api.sleeper.app/v1/league/${lg.league_id}/traded_picks`).catch(()=>[]),
  ]);
  const sf = (lg.roster_positions||[]).includes("SUPER_FLEX") || (lg.roster_positions||[]).filter(p=>p==="QB").length>1;
  const key = fmtKey(sf);
  const uById = Object.fromEntries(users.map(u=>[u.user_id, u.metadata?.team_name || u.display_name]));
  const seasons = [String(parseInt(lg.season)+1), String(parseInt(lg.season)+2)];
  const rounds = Math.min(4, lg.settings?.draft_rounds || 4);
  const owner = {};
  for (const s of seasons) for (let rd=1; rd<=rounds; rd++)
    for (const r of rosters) owner[`${s}-${rd}-${r.roster_id}`] = r.roster_id;
  for (const tp of traded)
    if (owner[`${tp.season}-${tp.round}-${tp.roster_id}`] !== undefined)
      owner[`${tp.season}-${tp.round}-${tp.roster_id}`] = tp.owner_id;
  const raw = rosters.map(r => {
    const players = (r.players||[]).map(pid => BY_SID[pid]).filter(Boolean)
      .map(p => ({ n:p.n, p:p.p, v:p[key], a:p.a, hot:p.hot })).sort((a,b)=>b.v-a.v);
    return { id:String(r.roster_id), name: uById[r.owner_id] || `Team ${r.roster_id}`, players, rawPicks: [] };
  });
  for (const k in owner){
    const [s, rd, orig] = k.split("-");
    const own = raw.find(t=>t.id===String(owner[k]));
    if (own) own.rawPicks.push({ year:s, round:parseInt(rd), origId:String(orig) });
  }
  return analyzeLeague(lg.name, raw, sf, VALUES.updated);
}

// ---------------- MFL import (works when MFL serves CORS headers; hosted proxy otherwise) ----------------
function parseMfl(input){
  const url = input.trim();
  const m = url.match(/(www\d+)\.myfantasyleague\.com\/(\d{4})\/[^\d]*(\d{4,8})/);
  if (m) return { host:`https://${m[1]}.myfantasyleague.com`, year:m[2], id:m[3] };
  const idOnly = url.match(/^(\d{4,8})$/);
  if (idOnly) return { host:"https://api.myfantasyleague.com", year:String(new Date().getFullYear()), id:idOnly[1] };
  return null;
}
async function loadMFL(input){
  const cfg = parseMfl(input);
  if(!cfg) throw new Error("Paste your full MFL league URL or the league ID.");
  const j = async (t)=>{ 
    const r = await pfetch(`${cfg.host}/${cfg.year}/export?TYPE=${t}&L=${cfg.id}&JSON=1`);
    if(!r.ok) throw new Error("MFL: "+r.status); return r.json(); };
  const [lgR, rosR, pdbR, fdpR] = await Promise.all([j("league"), j("rosters"), j("players&DETAILS=0"), j("futureDraftPicks")]);
  const lg = lgR.league;
  const frs = Object.fromEntries(lg.franchises.franchise.map(f=>[f.id, f.name.trim()]));
  const pdb = Object.fromEntries(pdbR.players.player.map(p=>[p.id, p]));
  const qbSlot = (lg.starters?.position||[]).find(p=>p.name==="QB");
  const sf = !!(qbSlot && /2/.test(qbSlot.limit||"")) || (lg.starters?.position||[]).some(p=>/OP|SF/i.test(p.name));
  const key = fmtKey(sf);
  const rosters = Array.isArray(rosR.rosters.franchise)? rosR.rosters.franchise : [rosR.rosters.franchise];
  const raw = rosters.map(fr => {
    let pls = fr.player || []; if(!Array.isArray(pls)) pls=[pls];
    const players = pls.map(pl => {
      const pr = pdb[pl.id];
      if(!pr || !["QB","RB","WR","TE"].includes(pr.position)) return null;
      const [last, first] = (pr.name+", ").split(", ");
      const name = `${first} ${last}`.trim();
      const rec = BY_MID[pl.id] || BY_NAME[normName(name)];
      return rec ? { n:rec.n, p:rec.p, v:rec[key], a:rec.a, hot:rec.hot } : { n:name, p:pr.position, v:50, a:null };
    }).filter(Boolean).sort((a,b)=>b.v-a.v);
    return { id:fr.id, name:frs[fr.id]||fr.id, players, rawPicks:[] };
  });
  let fdp = fdpR.futureDraftPicks?.franchise || [];
  if(!Array.isArray(fdp)) fdp=[fdp];
  for (const f of fdp){
    let picks = f.futureDraftPick || []; if(!Array.isArray(picks)) picks=[picks];
    const team = raw.find(t=>t.id===f.id);
    if(team) team.rawPicks = picks.map(pk=>({ year:pk.year, round:parseInt(pk.round), origId:pk.originalPickFor }));
  }
  return analyzeLeague(lg.name, raw, sf, VALUES.updated);
}

// ---------------- Fleaflicker import (players only; picks not exposed simply) ----------------
async function loadFleaflicker(leagueId){
  const id = leagueId.trim().match(/(\d{3,8})/)?.[1];
  if(!id) throw new Error("Enter your Fleaflicker league ID (the number in your league URL).");
  const r = await pfetch(`https://www.fleaflicker.com/api/FetchLeagueRosters?sport=NFL&league_id=${id}`);
  if(!r.ok) throw new Error("Fleaflicker: "+r.status);
  const data = await r.json();
  if(!data.rosters?.length) throw new Error("League not found or empty.");
  const raw = data.rosters.map(ro => {
    const players = (ro.players||[]).map(sl => {
      const pp = sl.proPlayer; if(!pp || !["QB","RB","WR","TE"].includes(pp.position)) return null;
      const rec = BY_NAME[normName(pp.nameFull)];
      return rec ? { n:rec.n, p:rec.p, v:rec.v1, a:rec.a, hot:rec.hot } : { n:pp.nameFull, p:pp.position, v:50, a:null };
    }).filter(Boolean).sort((a,b)=>b.v-a.v);
    return { id:String(ro.team.id), name:ro.team.name, players, rawPicks:[] };
  });
  return analyzeLeague(data.league?.name || "Fleaflicker League", raw, false, VALUES.updated);
}
const corsHint = (e) => (e instanceof TypeError)
  ? (PROXY ? "The proxy could not reach the platform. Check that your Worker is deployed and the URL is correct."
           : "This platform blocks direct browser requests (CORS). Deploy the included Cloudflare Worker (5 minutes, free), set its URL in the PROXY constant at the top of this file, and MFL/Fleaflicker imports will work.")
  : e.message;

// ---------------- shared UI ----------------
function Bar({val,max,color}){
  return <div style={{height:6,background:C.soft,borderRadius:3,overflow:"hidden"}}>
    <div style={{height:"100%",width:`${Math.min(100,val/max*100)}%`,background:color,borderRadius:3,transition:"width 400ms ease"}}/></div>;
}
function Tag({text}){
  const col = text==="CONTEND"?C.accent : text==="REBUILD"?C.green : C.muted;
  return <span style={{fontFamily:font.disp,fontWeight:600,fontSize:11,letterSpacing:"0.08em",color:col,background:C.soft,borderRadius:5,padding:"2px 7px"}}>{text}</span>;
}
function Num({children,size=24}){
  return <span style={{fontFamily:font.disp,fontWeight:700,fontSize:size,fontVariantNumeric:"tabular-nums",letterSpacing:"-0.01em"}}>{children}</span>;
}

function verdict(a,b,nameA,nameB){
  if(a.adj===0&&b.adj===0) return {label:"Add assets to each side",tone:C.muted,pct:0};
  const avg=(a.adj+b.adj)/2||1; const pct=((a.adj-b.adj)/avg)*100; const abs=Math.abs(pct);
  const winner=pct>0?nameA:nameB;
  if(abs<5) return {label:"Fair deal",tone:C.green,pct};
  if(abs<12) return {label:`Slight edge · ${winner}`,tone:C.ink,pct};
  if(abs<25) return {label:`Clear win · ${winner}`,tone:C.warn,pct};
  return {label:`Lopsided toward ${winner}`,tone:C.warn,pct};
}

function AssetRow({asset,onClick,added}){
  return <button onClick={onClick} disabled={added} style={{display:"flex",alignItems:"center",gap:10,width:"100%",background:"transparent",border:"none",borderBottom:`1px solid ${C.line}`,padding:"10px 4px",cursor:added?"default":"pointer",opacity:added?0.35:1,color:C.ink,textAlign:"left",fontFamily:font.body,fontSize:14}}>
    <span style={{fontFamily:font.disp,fontWeight:600,fontSize:11,color:POS_COLOR[asset.p]||C.muted,width:28,letterSpacing:"0.05em"}}>{asset.p||"PK"}</span>
    <span style={{flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{asset.n}{asset.hot?" \ud83d\udd25":""}</span>
    <span style={{fontFamily:font.disp,fontWeight:600,fontVariantNumeric:"tabular-nums",color:C.muted,fontSize:13}}>{asset.v.toLocaleString()}</span>
  </button>;
}
function Chip({asset,onRemove}){
  return <button onClick={onRemove} style={{display:"inline-flex",alignItems:"center",gap:6,background:C.soft,border:"none",borderRadius:999,padding:"6px 11px",margin:"0 6px 6px 0",color:C.ink,cursor:"pointer",fontFamily:font.body,fontSize:13}}>
    <span>{asset.n}</span><span style={{color:C.muted,fontFamily:font.disp,fontWeight:600,fontVariantNumeric:"tabular-nums"}}>{asset.v.toLocaleString()}</span><span style={{color:C.accent,fontWeight:600}}>×</span></button>;
}
function Select({value,onChange,options}){
  return <select value={value} onChange={onChange} style={{width:"100%",background:C.surface,color:C.ink,border:`1px solid ${C.line}`,borderRadius:10,padding:"11px 12px",fontFamily:font.disp,fontWeight:600,fontSize:16,boxShadow:"0 1px 2px rgba(16,22,28,0.04)"}}>
    {options.map(o=><option key={o.value} value={o.value}>{o.label}</option>)}</select>;
}

function TeamSide({league,label,teamId,setTeamId,picked,setPicked}){
  const [query,setQuery]=useState("");
  const team=league.teams.find(t=>t.id===teamId);
  const assets=useMemo(()=>{
    if(!team) return [];
    const all=[...team.players,...team.picks.map(p=>({...p,p:null}))];
    const q=query.trim().toLowerCase();
    return q? all.filter(a=>a.n.toLowerCase().includes(q)) : all;
  },[team,query]);
  const keys=new Set(picked.map(a=>a.n));
  return <div style={{flex:1,minWidth:0}}>
    <div style={{fontFamily:font.disp,fontWeight:600,fontSize:12,letterSpacing:"0.1em",color:C.muted,marginBottom:8}}>{label}</div>
    <Select value={teamId} onChange={e=>{setTeamId(e.target.value);setPicked([]);}}
      options={league.teams.map(t=>({value:t.id,label:`#${t.rank}  ${t.name}`}))}/>
    <div style={{minHeight:40,margin:"10px 0 4px"}}>
      {picked.map(a=><Chip key={a.n} asset={a} onRemove={()=>setPicked(picked.filter(x=>x.n!==a.n))}/>)}
      {picked.length===0 && <div style={{color:C.muted,fontSize:13,fontFamily:font.body,padding:"8px 2px"}}>Tap players or picks below to add them.</div>}
    </div>
    <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Search roster + picks"
      style={{width:"100%",boxSizing:"border-box",background:C.surface,color:C.ink,border:`1px solid ${C.line}`,borderRadius:10,padding:"9px 12px",fontFamily:font.body,fontSize:14,marginBottom:6}}/>
    <div style={{maxHeight:250,overflowY:"auto",...card,borderRadius:12,padding:"0 10px"}}>
      {assets.map(a=><AssetRow key={a.n} asset={a} added={keys.has(a.n)} onClick={()=>!keys.has(a.n)&&setPicked([...picked,a])}/>)}
    </div>
  </div>;
}

function TradeDesk({league,preload}){
  const [teamA,setTeamA]=useState(preload?.teamA||league.teams[0].id);
  const [teamB,setTeamB]=useState(preload?.teamB||league.teams[1].id);
  const [pickedA,setPickedA]=useState(preload?.sideA||[]);
  const [pickedB,setPickedB]=useState(preload?.sideB||[]);
  const [showMath,setShowMath]=useState(false);
  const nameA=league.teams.find(t=>t.id===teamA)?.name||"A";
  const nameB=league.teams.find(t=>t.id===teamB)?.name||"B";
  const mA=sideMath(pickedA), mB=sideMath(pickedB);
  const v=verdict(mA,mB,nameA,nameB);
  const tilt=Math.max(-7,Math.min(7,v.pct*0.35));
  return <>
    <section style={{...card,padding:"20px 18px 14px",marginBottom:18}}>
      <div style={{fontFamily:font.disp,fontWeight:700,fontSize:21,textAlign:"center",color:v.tone,minHeight:28,letterSpacing:"-0.01em"}}>{v.label}</div>
      <div style={{position:"relative",height:66,margin:"8px 0 2px"}}>
        <div style={{position:"absolute",left:"10%",right:"10%",top:30,height:3,borderRadius:2,background:C.ink,opacity:0.9,transform:`rotate(${-tilt}deg)`,transformOrigin:"center",transition:"transform 480ms cubic-bezier(.2,.9,.3,1.15)"}}/>
        <div style={{position:"absolute",left:"50%",top:24,width:12,height:12,marginLeft:-6,transform:"rotate(45deg)",background:C.accent,borderRadius:2}}/>
        <div style={{position:"absolute",left:0,bottom:0,width:"44%"}}>
          <div style={{fontFamily:font.body,fontSize:11,color:C.muted,letterSpacing:"0.06em",textTransform:"uppercase",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{nameA}</div>
          <Num size={24}>{mA.adj.toLocaleString()}</Num>
        </div>
        <div style={{position:"absolute",right:0,bottom:0,width:"44%",textAlign:"right"}}>
          <div style={{fontFamily:font.body,fontSize:11,color:C.muted,letterSpacing:"0.06em",textTransform:"uppercase",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{nameB}</div>
          <Num size={24}>{mB.adj.toLocaleString()}</Num>
        </div>
      </div>
      <button onClick={()=>setShowMath(!showMath)} style={{display:"block",margin:"6px auto 0",background:"none",border:"none",color:C.muted,fontFamily:font.body,fontSize:12,cursor:"pointer",textDecoration:"underline"}}>{showMath?"Hide the math":"Show the math"}</button>
      {showMath && <div style={{fontFamily:font.body,fontSize:13,color:C.muted,lineHeight:1.6,marginTop:10,borderTop:`1px solid ${C.line}`,paddingTop:12}}>
        Raw totals: {nameA} {mA.raw.toLocaleString()} · {nameB} {mB.raw.toLocaleString()}. The best asset on each side counts at 100%; each additional piece counts less (88%, 78%… floor 55%) because the best player in a deal matters most. Future picks are priced from the original team's projected finish.
      </div>}
    </section>
    <div style={{display:"flex",gap:16,flexWrap:"wrap"}}>
      <TeamSide league={league} label="SIDE A SENDS" teamId={teamA} setTeamId={setTeamA} picked={pickedA} setPicked={setPickedA}/>
      <TeamSide league={league} label="SIDE B SENDS" teamId={teamB} setTeamId={setTeamB} picked={pickedB} setPicked={setPickedB}/>
    </div>
  </>;
}

function Dashboard({league}){
  const [open,setOpen]=useState(null);
  const maxTotal=Math.max(...league.teams.map(t=>t.strength));
  const maxPos={}; for(const pos of POS_LIST) maxPos[pos]=Math.max(...league.teams.map(t=>t.pos[pos]));
  return <section>
    {league.teams.map(t=>{
      const isOpen=open===t.id;
      return <div key={t.id} style={{...card,padding:"13px 15px",marginBottom:10}}>
        <button onClick={()=>setOpen(isOpen?null:t.id)} style={{display:"flex",alignItems:"center",gap:12,width:"100%",background:"none",border:"none",color:C.ink,cursor:"pointer",padding:0,textAlign:"left"}}>
          <span style={{fontFamily:font.disp,fontWeight:700,fontSize:17,color:C.muted,width:26}}>{t.rank}</span>
          <span style={{flex:1,minWidth:0}}>
            <span style={{display:"flex",alignItems:"center",gap:8}}>
              <span style={{fontFamily:font.disp,fontWeight:600,fontSize:16,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{t.name}</span>
              <Tag text={t.phase}/>
            </span>
            <span style={{display:"block",marginTop:7}}><Bar val={t.strength} max={maxTotal} color={C.accent}/></span>
          </span>
          <Num size={17}>{t.strength.toLocaleString()}</Num>
        </button>
        {isOpen && <div style={{marginTop:12,borderTop:`1px solid ${C.line}`,paddingTop:12}}>
          {POS_LIST.map(pos=><div key={pos} style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
            <span style={{fontFamily:font.disp,fontWeight:600,fontSize:12,color:POS_COLOR[pos],width:28}}>{pos}</span>
            <span style={{flex:1}}><Bar val={t.pos[pos]} max={maxPos[pos]} color={POS_COLOR[pos]}/></span>
            <span style={{fontFamily:font.disp,fontWeight:600,fontSize:12,color:t.pos[pos]>=league.medians[pos]?C.green:C.warn,width:52,textAlign:"right",fontVariantNumeric:"tabular-nums"}}>{t.pos[pos]>=league.medians[pos]?"+":""}{Math.round(t.pos[pos]-league.medians[pos])}</span>
          </div>)}
          <div style={{display:"flex",gap:18,marginTop:10,fontFamily:font.body,fontSize:12.5,color:C.muted,flexWrap:"wrap"}}>
            <span>Core age <b style={{color:C.ink}}>{t.age}</b></span>
            <span>Pick capital <b style={{color:C.ink}}>{t.picksVal.toLocaleString()}</b></span>
            <span>Best pick <b style={{color:C.ink}}>{t.picks[0]?.n||"—"}</b></span>
          </div>
          <div style={{marginTop:8,fontFamily:font.body,fontSize:12.5,color:C.muted}}>Top assets: {t.players.slice(0,3).map(p=>p.n).join(", ")}</div>
        </div>}
      </div>;
    })}
  </section>;
}

function findTrades(league, teamId){
  const { teams, medians } = league;
  const me = teams.find(t=>t.id===teamId);
  const results=[];
  for(const them of teams){
    if(them.id===me.id) continue;
    for(const give of POS_LIST) for(const get of POS_LIST){
      if(give===get) continue;
      if(me.pos[give]<=medians[give]||them.pos[get]<=medians[get]||me.pos[get]>=medians[get]||them.pos[give]>=medians[give]) continue;
      const fit = (me.pos[give]-medians[give]) - (me.pos[get]-medians[get]) + (them.pos[get]-medians[get]) - (them.pos[give]-medians[give]);
      const mine = me.players.filter(p=>p.p===give).sort((a,b)=>b.v-a.v).slice(1,5);
      const theirs = them.players.filter(p=>p.p===get).sort((a,b)=>b.v-a.v).slice(1,5);
      for(const a of mine) for(const b of theirs){
        if(a.v<400||b.v<400) continue;
        const r=a.v/b.v; if(r<0.72||r>1.39) continue;
        let sideA=[a], sideB=[b];
        let diff = sideMath(sideA).adj - sideMath(sideB).adj;
        if(Math.abs(diff)/((sideMath(sideA).adj+sideMath(sideB).adj)/2) > 0.05){
          const light = diff>0? them : me;
          const pool = [...light.picks, ...light.players.slice(6)].filter(x=>x.v>=200);
          let best=null;
          for(const cand of pool){
            const sa = diff>0? sideA : [...sideA,cand];
            const sb = diff>0? [...sideB,cand] : sideB;
            const d = Math.abs(sideMath(sa).adj - sideMath(sb).adj);
            if(!best||d<best.d) best={d,cand};
          }
          if(best){ if(diff>0) sideB=[...sideB,best.cand]; else sideA=[...sideA,best.cand]; }
        }
        const mA=sideMath(sideA), mB=sideMath(sideB);
        const pct = Math.abs(mA.adj-mB.adj)/((mA.adj+mB.adj)/2)*100;
        if(pct>8) continue;
        results.push({ partner:them, give, get, sideA, sideB, mA, mB, pct, fit,
          why:`You're deep at ${give}, thin at ${get} — ${them.name} is the reverse.` });
      }
    }
  }
  results.sort((x,y)=> (x.pct - y.pct) + (y.fit - x.fit)/4000 );
  const seen=new Set(); const out=[];
  for(const r of results){ const key=r.partner.id+r.sideA[0].n;
    if(seen.has(key)) continue; seen.add(key); out.push(r); if(out.length>=6) break; }
  return out;
}

function Recommended({league,goToDesk}){
  const [teamId,setTeamId]=useState(league.teams[0].id);
  const trades=useMemo(()=>findTrades(league,teamId),[league,teamId]);
  const me=league.teams.find(t=>t.id===teamId);
  return <section>
    <div style={{marginBottom:14}}>
      <Select value={teamId} onChange={e=>setTeamId(e.target.value)}
        options={league.teams.map(t=>({value:t.id,label:`Find trades for: ${t.name}`}))}/>
    </div>
    {trades.length===0 && <div style={{fontFamily:font.body,fontSize:14,color:C.muted,padding:"20px 4px",lineHeight:1.6}}>
      No clean positional swaps for {me.name} right now — no partner's needs line up inside the fairness window. Build something custom in the Trade Desk.
    </div>}
    {trades.map((tr,i)=>
      <div key={i} style={{...card,padding:15,marginBottom:12}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <span style={{fontFamily:font.disp,fontWeight:600,fontSize:15}}>with {tr.partner.name} <span style={{color:C.muted,fontSize:12}}>#{tr.partner.rank}</span></span>
          <span style={{fontFamily:font.disp,fontWeight:600,fontSize:12,color:tr.pct<5?C.green:C.ink}}>{tr.pct<5?"FAIR":"NEAR-FAIR"} · Δ{tr.pct.toFixed(1)}%</span>
        </div>
        <div style={{display:"flex",gap:10,alignItems:"stretch"}}>
          <div style={{flex:1,background:C.soft,borderRadius:10,padding:"10px 12px"}}>
            <div style={{fontFamily:font.body,fontSize:10.5,color:C.muted,letterSpacing:"0.07em",marginBottom:6}}>YOU SEND · {tr.mA.adj.toLocaleString()}</div>
            {tr.sideA.map(a=><div key={a.n} style={{fontFamily:font.body,fontSize:13.5,marginBottom:3}}>{a.n} <span style={{color:C.muted,fontSize:12,fontFamily:font.disp,fontWeight:600}}>{a.v.toLocaleString()}</span></div>)}
          </div>
          <div style={{alignSelf:"center",color:C.accent,fontFamily:font.disp,fontWeight:700,fontSize:18}}>⇄</div>
          <div style={{flex:1,background:C.soft,borderRadius:10,padding:"10px 12px"}}>
            <div style={{fontFamily:font.body,fontSize:10.5,color:C.muted,letterSpacing:"0.07em",marginBottom:6}}>YOU GET · {tr.mB.adj.toLocaleString()}</div>
            {tr.sideB.map(a=><div key={a.n} style={{fontFamily:font.body,fontSize:13.5,marginBottom:3}}>{a.n} <span style={{color:C.muted,fontSize:12,fontFamily:font.disp,fontWeight:600}}>{a.v.toLocaleString()}</span></div>)}
          </div>
        </div>
        <div style={{fontFamily:font.body,fontSize:12.5,color:C.muted,marginTop:10,lineHeight:1.5}}>{tr.why}</div>
        <button onClick={()=>goToDesk({teamA:teamId,teamB:tr.partner.id,sideA:tr.sideA,sideB:tr.sideB})} style={{marginTop:10,background:C.accent,border:"none",color:"#fff",borderRadius:9,padding:"8px 15px",fontFamily:font.disp,fontWeight:600,fontSize:13,letterSpacing:"0.04em",cursor:"pointer"}}>Open in Trade Desk</button>
      </div>
    )}
    <div style={{fontFamily:font.body,fontSize:12,color:C.muted,lineHeight:1.5}}>
      Suggestions pair one team's positional surplus with another's need, stay within 8% adjusted value, and add a pick or depth piece to balance. Each team's best player at a position is held back.
    </div>
  </section>;
}

function ImportScreen({onLoad}){
  const [platform,setPlatform]=useState("sleeper");
  const [username,setUsername]=useState("");
  const [season,setSeason]=useState("2026");
  const [mflUrl,setMflUrl]=useState("");
  const [ffId,setFfId]=useState("");
  const [leagues,setLeagues]=useState(null);
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState(null);
  const run=async(fn)=>{ setBusy(true); setErr(null);
    try{ await fn(); } catch(e){ setErr(corsHint(e)); } finally{ setBusy(false); } };
  const platforms=[["sleeper","Sleeper"],["mfl","MFL"],["fleaflicker","Fleaflicker"]];
  const inputStyle={flex:"2 1 200px",background:C.surface,color:C.ink,border:`1px solid ${C.line}`,borderRadius:10,padding:"11px 13px",fontFamily:font.body,fontSize:15};
  const goStyle=(on)=>({flex:"1 1 110px",background:C.accent,color:"#fff",border:"none",borderRadius:10,padding:"11px 0",fontFamily:font.disp,fontWeight:600,fontSize:14,cursor:"pointer",opacity:on?1:0.5});
  return <section style={{...card,padding:"22px 18px"}}>
    <div style={{fontFamily:font.disp,fontWeight:700,fontSize:19,marginBottom:4}}>Import your league</div>
    <div style={{fontFamily:font.body,fontSize:13.5,color:C.muted,lineHeight:1.55,marginBottom:14}}>
      Rosters, picks, and format load straight from your platform. Nothing is stored.
    </div>
    <div style={{display:"flex",gap:6,marginBottom:14}}>
      {platforms.map(([id,label])=>
        <button key={id} onClick={()=>{setPlatform(id);setErr(null);setLeagues(null);}}
          style={{flex:1,background:platform===id?C.ink:C.soft,color:platform===id?"#fff":C.muted,border:"none",borderRadius:9,padding:"9px 0",fontFamily:font.disp,fontWeight:600,fontSize:13.5,cursor:"pointer"}}>{label}</button>)}
    </div>

    {platform==="sleeper" && <>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        <input value={username} onChange={e=>setUsername(e.target.value)} onKeyDown={e=>e.key==="Enter"&&username.trim()&&run(async()=>{const r=await importSleeper(username.trim(),season); setLeagues(r.leagues);})} placeholder="Sleeper username" style={inputStyle}/>
        <select value={season} onChange={e=>setSeason(e.target.value)} style={{flex:"0 0 90px",background:C.surface,border:`1px solid ${C.line}`,borderRadius:10,padding:"11px 8px",fontFamily:font.disp,fontWeight:600,fontSize:14}}>
          <option>2026</option><option>2025</option>
        </select>
        <button onClick={()=>run(async()=>{const r=await importSleeper(username.trim(),season); setLeagues(r.leagues);})} disabled={busy||!username.trim()} style={goStyle(!busy&&username.trim())}>{busy?"Loading\u2026":"Find leagues"}</button>
      </div>
      {leagues && <div style={{marginTop:14}}>
        {leagues.map(lg=>
          <button key={lg.league_id} onClick={()=>run(async()=>onLoad(await loadSleeperLeague(lg)))} style={{display:"flex",justifyContent:"space-between",alignItems:"center",width:"100%",background:C.soft,border:"none",borderRadius:10,padding:"12px 14px",marginBottom:8,cursor:"pointer",fontFamily:font.body,fontSize:14,color:C.ink}}>
            <span style={{fontWeight:600}}>{lg.name}</span>
            <span style={{color:C.muted,fontSize:12}}>{lg.total_rosters} teams{(lg.roster_positions||[]).includes("SUPER_FLEX")?" \u00b7 SF":""}</span>
          </button>)}
      </div>}
    </>}

    {platform==="mfl" && <>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        <input value={mflUrl} onChange={e=>setMflUrl(e.target.value)} onKeyDown={e=>e.key==="Enter"&&mflUrl.trim()&&run(async()=>onLoad(await loadMFL(mflUrl)))} placeholder="MFL league URL or ID" style={inputStyle}/>
        <button onClick={()=>run(async()=>onLoad(await loadMFL(mflUrl)))} disabled={busy||!mflUrl.trim()} style={goStyle(!busy&&mflUrl.trim())}>{busy?"Loading\u2026":"Import"}</button>
      </div>
      <div style={{fontFamily:font.body,fontSize:12,color:C.muted,marginTop:8,lineHeight:1.5}}>
        Paste the full URL from your browser, e.g. www52.myfantasyleague.com/2026/home/12345. Rosters, future picks, and superflex detection included.
      </div>
    </>}

    {platform==="fleaflicker" && <>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        <input value={ffId} onChange={e=>setFfId(e.target.value)} onKeyDown={e=>e.key==="Enter"&&ffId.trim()&&run(async()=>onLoad(await loadFleaflicker(ffId)))} placeholder="Fleaflicker league ID" style={inputStyle}/>
        <button onClick={()=>run(async()=>onLoad(await loadFleaflicker(ffId)))} disabled={busy||!ffId.trim()} style={goStyle(!busy&&ffId.trim())}>{busy?"Loading\u2026":"Import"}</button>
      </div>
      <div style={{fontFamily:font.body,fontSize:12,color:C.muted,marginTop:8,lineHeight:1.5}}>
        Rosters import now; draft-pick import for Fleaflicker is coming. 1QB values by default.
      </div>
    </>}

    {err && <div style={{color:C.warn,fontFamily:font.body,fontSize:13,marginTop:12,lineHeight:1.5}}>{err}</div>}
    <div style={{marginTop:16,paddingTop:14,borderTop:`1px solid ${C.line}`,fontFamily:font.body,fontSize:13,color:C.muted,lineHeight:1.55}}>
      ESPN and Yahoo require sign-in and aren't supported yet.</div>
  </section>;
}

function App(){
  const [league,setLeague]=useState(null);
  const [tab,setTab]=useState("desk");
  const [preload,setPreload]=useState(null);
  const goToDesk=(p)=>{ setPreload({...p,key:Date.now()}); setTab("desk"); };
  const tabs=[["desk","Trade Desk"],["league","League"],["trades","Suggested"]];
  return <div style={{minHeight:"100vh",background:C.bg,color:C.ink,padding:"22px 14px 60px"}}>
    <style>{FONTS}</style>
    <div style={{maxWidth:860,margin:"0 auto"}}>
      <header style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16,gap:10,flexWrap:"wrap"}}>
        <div>
          <div style={{fontFamily:font.disp,fontWeight:700,fontSize:26,letterSpacing:"-0.02em"}}>Trade<span style={{color:C.accent}}>Desk</span></div>
          <div style={{fontFamily:font.body,fontSize:12.5,color:C.muted,marginTop:2}}>
            {league? `${league.name} · ${league.sf?"Superflex":"1QB"} · values ${VALUES.updated}` : `Dynasty & keeper trade values · updated ${VALUES.updated}`}
          </div>
        </div>
        {league && <button onClick={()=>{setLeague(null);setPreload(null);}} style={{background:"none",border:`1px solid ${C.line}`,borderRadius:9,padding:"7px 12px",fontFamily:font.body,fontSize:12.5,color:C.muted,cursor:"pointer"}}>Switch league</button>}
      </header>
      {!league && <ImportScreen onLoad={l=>setLeague(l)}/>}
      {league && <>
        <nav style={{display:"flex",gap:8,marginBottom:18}}>
          {tabs.map(([id,label])=>
            <button key={id} onClick={()=>setTab(id)} style={{flex:1,background:tab===id?C.ink:C.surface,color:tab===id?"#fff":C.muted,border:`1px solid ${tab===id?C.ink:C.line}`,borderRadius:10,padding:"10px 0",fontFamily:font.disp,fontWeight:600,fontSize:14,cursor:"pointer"}}>{label}</button>)}
        </nav>
        {tab==="desk" && <TradeDesk key={(preload?.key||"f")+league.name} league={league} preload={preload}/>}
        {tab==="league" && <Dashboard league={league}/>}
        {tab==="trades" && <Recommended league={league} goToDesk={goToDesk}/>}
      </>}
      <footer style={{marginTop:26,fontFamily:font.body,fontSize:11.5,color:C.muted,lineHeight:1.5}}>
        Values blend multiple market and expert-consensus sources, adjusted by position age curves. Future picks are priced by the original team's projected finish. Player data © their respective sources.
      </footer>
    </div>
  </div>;
}

function Root(){
  const [state,setState]=useState("loading");
  useEffect(()=>{
    fetch("./data/values.json").then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
      .then(d=>{ initValues(d); setState("ready"); })
      .catch(e=>{ console.error(e); setState("error"); });
  },[]);
  if(state==="loading") return <div style={{minHeight:"100vh",background:C.bg,color:C.muted,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:font.disp,fontSize:18}}>Loading values…</div>;
  if(state==="error") return <div style={{minHeight:"100vh",background:C.bg,color:C.ink,display:"flex",alignItems:"center",justifyContent:"center",padding:24,textAlign:"center",fontFamily:font.body,fontSize:15,lineHeight:1.6}}>Couldn't load data/values.json. In the repo's Actions tab, run "Update player values" once, then refresh.</div>;
  return <App/>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
